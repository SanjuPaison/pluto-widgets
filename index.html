<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluto Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://sanjupaison.github.io/pluto-phases-meter/pluto-style.css">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #pw-shell{max-width:820px;margin:0 auto;padding:14px 10px 28px;}

  /* ---- quick-glance row (big icons, top of page) ---- */
  #pw-quick-tabs{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:0 0 10px;
  }
  .pw-quick-tab{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--card-border);
    background:var(--card); font-size:26px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-hi); transition:background .15s, border-color .15s, transform .1s;
  }
  .pw-quick-tab:hover{ border-color:var(--accent); }
  .pw-quick-tab:active{ transform:scale(.95); }
  .pw-quick-tab.active{ background:var(--accent); border-color:var(--accent); color:var(--bg-0); }

  .pw-quick-panel{ display:none; margin-bottom:16px; }
  .pw-quick-panel.active{ display:block; }
  .pw-quick-panel iframe{
    width:100%; border:0; display:block; background:transparent; min-height:60px;
  }

  /* ---- shared birth profile card ---- */
  #pw-profile{
    background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius, 14px);
    padding:14px 16px; margin-bottom:16px; font-family:var(--font-body); color:var(--text-hi);
  }
  #pw-profile h2{
    font-family:var(--font-display); font-size:.78rem; letter-spacing:.25em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px; font-weight:600;
  }
  .pw-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .pw-row > div{ flex:1 1 70px; min-width:70px; }
  .pw-row label{ display:block; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
  #pw-profile select, #pw-profile input[type="text"]{
    width:100%; font-family:var(--font-body); font-size:14px; padding:8px 9px;
    border:1px solid var(--card-border); border-radius:var(--radius-sm,8px);
    background:var(--bg-1); color:var(--text-hi); box-sizing:border-box;
  }
  .pw-place-row{ display:flex; gap:8px; }
  .pw-place-row input{ flex:1; }
  .pw-unknown{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-lo); margin:2px 0 10px; }
  #pw-profile-save{
    border:1px solid var(--accent); background:var(--accent); color:var(--bg-0); font-weight:700;
    border-radius:var(--radius-sm,8px); padding:9px 16px; font-size:13.5px; cursor:pointer;
  }
  #pw-profile-note{ font-size:11px; color:var(--text-faint); margin-top:8px; }

  #pw-profile-summary{ display:none; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  #pw-profile-summary .pw-sum-text{ font-size:14px; }
  #pw-profile-summary .pw-sum-text b{ color:var(--accent); }
  #pw-profile-edit{
    border:1px solid var(--card-border); background:var(--bg-1); color:var(--text-hi);
    border-radius:var(--radius-sm,8px); padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  #pw-profile.saved #pw-profile-form{ display:none; }
  #pw-profile.saved #pw-profile-summary{ display:flex; }

  /* ---- icon-only detailed tab bar (now below birth info) ---- */
  #pw-tabs{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--card-border); border-radius:999px;
    padding:6px; margin:0 0 14px;
  }
  .pw-tab{
    width:42px; height:42px; border-radius:50%; border:1px solid transparent;
    background:transparent; font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-hi); transition:background .15s, border-color .15s, transform .1s;
  }
  .pw-tab:hover{ border-color:var(--card-border); }
  .pw-tab:active{ transform:scale(.94); }
  .pw-tab.active{ background:var(--accent); border-color:var(--accent); color:var(--bg-0); }

  /* ---- widget panels / iframes ---- */
  .pw-panel{ display:none; }
  .pw-panel.active{ display:block; }
  .pw-panel iframe{
    width:100%; min-height:900px; border:0; display:block; border-radius:var(--radius,14px);
    background:transparent;
  }
</style>
</head>
<body data-theme="space">

<div id="pw-shell">

  <nav id="pw-quick-tabs" role="tablist" aria-label="Quick glance">
    <button class="pw-quick-tab" data-quick="forecast" title="Forecast — live reading" aria-label="Forecast">📊</button>
    <button class="pw-quick-tab" data-quick="location" title="Location" aria-label="Location">📍</button>
    <button class="pw-quick-tab" data-quick="partner" title="Partner" aria-label="Partner">💞</button>
    <button class="pw-quick-tab" data-quick="timeline" title="Timeline" aria-label="Timeline">📈</button>
  </nav>

  <div class="pw-quick-panel" data-quick-panel="forecast">
    <iframe src="widgets/meter/index.html" title="Forecast" loading="lazy"></iframe>
  </div>
  <div class="pw-quick-panel" data-quick-panel="location">
    <iframe src="widgets/location-checker/index.html" title="Location" loading="lazy"></iframe>
  </div>
  <div class="pw-quick-panel" data-quick-panel="partner">
    <iframe src="widgets/partner-match/index.html" title="Partner" loading="lazy"></iframe>
  </div>
  <div class="pw-quick-panel" data-quick-panel="timeline">
    <iframe src="widgets/timeline/index.html" title="Timeline" loading="lazy"></iframe>
  </div>

  <div id="pw-profile">
    <h2>Your Birth Details</h2>

    <div id="pw-profile-form">
      <div class="pw-row">
        <div>
          <label for="pw-month">Month</label>
          <select id="pw-month"></select>
        </div>
        <div>
          <label for="pw-day">Day</label>
          <select id="pw-day"></select>
        </div>
        <div>
          <label for="pw-year">Year</label>
          <select id="pw-year"></select>
        </div>
      </div>
      <div class="pw-row">
        <div>
          <label for="pw-hour">Hour</label>
          <select id="pw-hour"></select>
        </div>
        <div>
          <label for="pw-minute">Minute</label>
          <select id="pw-minute"></select>
        </div>
        <div>
          <label for="pw-ampm">AM/PM</label>
          <select id="pw-ampm"></select>
        </div>
      </div>
      <div class="pw-unknown">
        <input type="checkbox" id="pw-time-unknown">
        <label for="pw-time-unknown">I don't know my exact birth time</label>
      </div>
      <div class="pw-row">
        <div style="flex:1 1 100%;">
          <label for="pw-place">Birth place</label>
          <div class="pw-place-row">
            <input type="text" id="pw-place" placeholder="e.g. Kolkata, India" autocomplete="off">
          </div>
        </div>
      </div>
      <button type="button" id="pw-profile-save">Save &amp; use everywhere</button>
      <div id="pw-profile-note">
        Saved only in this browser (localStorage) — never sent anywhere by this page.
        Fills in automatically wherever a tool below needs birth details. Some tools
        may still ask you to confirm the place (for time zone) or pick it from a
        suggestion list the first time.
      </div>
    </div>

    <div id="pw-profile-summary">
      <div class="pw-sum-text" id="pw-profile-summary-text"></div>
      <button type="button" id="pw-profile-edit">Edit</button>
    </div>
  </div>

  <nav id="pw-tabs" role="tablist" aria-label="Choose a tool">
    <button class="pw-tab" data-target="meter" title="Pluto Phases Meter (live reading)" aria-label="Pluto Phases Meter">📊</button>
    <button class="pw-tab" data-target="happening" title="What Was Happening (single date)" aria-label="What Was Happening">🕰️</button>
    <button class="pw-tab" data-target="where-when" title="Where &amp; When (life event finder)" aria-label="Where and When">🔎</button>
    <button class="pw-tab" data-target="location-checker" title="Location Checker" aria-label="Location Checker">📍</button>
    <button class="pw-tab" data-target="partner-match" title="Partner Match" aria-label="Partner Match">💞</button>
    <button class="pw-tab" data-target="timeline" title="Pluto Phases Timeline (3-year)" aria-label="Pluto Phases Timeline">📈</button>
  </nav>

  <div class="pw-panel" data-panel="meter">
    <iframe src="widgets/meter/index.html" title="Pluto Phases Meter" loading="lazy"></iframe>
  </div>
  <div class="pw-panel" data-panel="happening">
    <iframe src="widgets/happening/index.html" title="What Was Happening" loading="lazy"></iframe>
  </div>
  <div class="pw-panel" data-panel="where-when">
    <iframe src="widgets/where-when/index.html" title="Where and When" loading="lazy"></iframe>
  </div>
  <div class="pw-panel" data-panel="location-checker">
    <iframe src="widgets/location-checker/index.html" title="Location Checker" loading="lazy"></iframe>
  </div>
  <div class="pw-panel" data-panel="partner-match">
    <iframe src="widgets/partner-match/index.html" title="Partner Match" loading="lazy"></iframe>
  </div>
  <div class="pw-panel" data-panel="timeline">
    <iframe src="widgets/timeline/index.html" title="Pluto Phases Timeline" loading="lazy"></iframe>
  </div>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "plutoWidgets.sharedBirthProfile";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DEFAULT_PROFILE = { month:1, day:1, year:1990, hour:12, minute:0, ampm:"PM", timeUnknown:false, place:"Kolkata, India" };

  // =========================================================
  // Detailed tab row (below birth info)
  // =========================================================
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".pw-tab"));
  var panels = Array.prototype.slice.call(document.querySelectorAll(".pw-panel"));

  function activateTab(name){
    tabs.forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-target") === name); });
    panels.forEach(function(p){ p.classList.toggle("active", p.getAttribute("data-panel") === name); });
    try { localStorage.setItem("plutoWidgets.lastTab", name); } catch(e){}
  }
  tabs.forEach(function(t){
    t.addEventListener("click", function(){ activateTab(t.getAttribute("data-target")); });
  });
  var initialTab = "meter";
  try {
    var stored = localStorage.getItem("plutoWidgets.lastTab");
    if (stored && document.querySelector('.pw-panel[data-panel="' + stored + '"]')) initialTab = stored;
  } catch(e){}
  activateTab(initialTab);

  // =========================================================
  // Quick-glance row (big icons, top of page)
  // =========================================================
  var quickTabs = Array.prototype.slice.call(document.querySelectorAll(".pw-quick-tab"));
  var quickPanels = Array.prototype.slice.call(document.querySelectorAll(".pw-quick-panel"));

  function activateQuick(name){
    var alreadyActive = quickTabs.some(function(t){
      return t.getAttribute("data-quick") === name && t.classList.contains("active");
    });
    if (alreadyActive){
      // tap again to close
      quickTabs.forEach(function(t){ t.classList.remove("active"); });
      quickPanels.forEach(function(p){ p.classList.remove("active"); });
      return;
    }
    quickTabs.forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-quick") === name); });
    quickPanels.forEach(function(p){ p.classList.toggle("active", p.getAttribute("data-quick-panel") === name); });
  }
  quickTabs.forEach(function(t){
    t.addEventListener("click", function(){ activateQuick(t.getAttribute("data-quick")); });
  });

  // =========================================================
  // Populate the shared birth-profile selects
  // =========================================================
  var monthSel = document.getElementById("pw-month");
  var daySel = document.getElementById("pw-day");
  var yearSel = document.getElementById("pw-year");
  var hourSel = document.getElementById("pw-hour");
  var minuteSel = document.getElementById("pw-minute");
  var ampmSel = document.getElementById("pw-ampm");
  var unknownBox = document.getElementById("pw-time-unknown");
  var placeInput = document.getElementById("pw-place");

  MONTHS.forEach(function(name, i){
    var o = document.createElement("option"); o.value = i + 1; o.textContent = name; monthSel.appendChild(o);
  });
  for (var d = 1; d <= 31; d++){
    var od = document.createElement("option"); od.value = d; od.textContent = d; daySel.appendChild(od);
  }
  var curYear = new Date().getUTCFullYear();
  for (var y = curYear; y >= 1930; y--){
    var oy = document.createElement("option"); oy.value = y; oy.textContent = y; yearSel.appendChild(oy);
  }
  for (var h = 1; h <= 12; h++){
    var oh = document.createElement("option"); oh.value = h; oh.textContent = (h < 10 ? "0" + h : h); hourSel.appendChild(oh);
  }
  for (var m = 0; m <= 59; m++){
    var om = document.createElement("option"); om.value = m; om.textContent = (m < 10 ? "0" + m : m); minuteSel.appendChild(om);
  }
  ["AM","PM"].forEach(function(p){
    var op = document.createElement("option"); op.value = p; op.textContent = p; ampmSel.appendChild(op);
  });

  // =========================================================
  // Load / save shared birth profile
  // =========================================================
  var profileCard = document.getElementById("pw-profile");
  var summaryText = document.getElementById("pw-profile-summary-text");

  function readProfile(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function writeProfile(p){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e){}
  }
  function formatSummary(p){
    var monthName = MONTHS[(p.month|0) - 1] || "";
    var timeStr = p.timeUnknown ? "time unknown" : p.hour + ":" + (p.minute < 10 ? "0" + p.minute : p.minute) + " " + p.ampm;
    return "<b>" + monthName + " " + p.day + ", " + p.year + "</b> &middot; " + timeStr + (p.place ? " &middot; " + p.place : "");
  }
  function fillFormFromProfile(p){
    if (!p) return;
    monthSel.value = p.month; daySel.value = p.day; yearSel.value = p.year;
    hourSel.value = p.hour; minuteSel.value = p.minute; ampmSel.value = p.ampm;
    unknownBox.checked = !!p.timeUnknown;
    placeInput.value = p.place || "";
  }
  function currentProfile(){
    return {
      month: parseInt(monthSel.value, 10),
      day: parseInt(daySel.value, 10),
      year: parseInt(yearSel.value, 10),
      hour: parseInt(hourSel.value, 10),
      minute: parseInt(minuteSel.value, 10),
      ampm: ampmSel.value,
      timeUnknown: unknownBox.checked,
      place: placeInput.value.trim()
    };
  }

  // If nothing saved yet, seed with a default profile and keep the
  // panel collapsed rather than forcing the user to fill it in first.
  var existing = readProfile();
  if (!existing){
    existing = DEFAULT_PROFILE;
    writeProfile(existing);
  }
  fillFormFromProfile(existing);
  summaryText.innerHTML = formatSummary(existing);
  profileCard.classList.add("saved");

  document.getElementById("pw-profile-save").addEventListener("click", function(){
    if (!monthSel.value || !daySel.value || !yearSel.value){
      alert("Please fill in your birth date.");
      return;
    }
    var p = currentProfile();
    writeProfile(p);
    summaryText.innerHTML = formatSummary(p);
    profileCard.classList.add("saved");
    applyProfileToAllIframes();
  });
  document.getElementById("pw-profile-edit").addEventListener("click", function(){
    profileCard.classList.remove("saved");
  });

  // =========================================================
  // Push the profile into each widget's iframe (detailed tabs)
  // =========================================================
  var WIDGET_MAP = {
    "happening": [
      ["month","ppw-birth-month"], ["day","ppw-birth-day"], ["year","ppw-birth-year"],
      ["hour","ppw-birth-hour"], ["minute","ppw-birth-minute"], ["ampm","ppw-birth-ampm"],
      ["unknown","ppw-time-unknown"], ["place","ppw-place"]
    ],
    "where-when": [
      ["month","ww-birth-month"], ["day","ww-birth-day"], ["year","ww-birth-year"],
      ["hour","ww-birth-hour"], ["minute","ww-birth-minute"], ["ampm","ww-birth-ampm"],
      ["place","ww-place"]
    ],
    "location-checker": [
      ["month","lc-bmonth"], ["day","lc-bday"], ["year","lc-byear"],
      ["hour","lc-bhour"], ["minute","lc-bminute"], ["ampm","lc-bampm"],
      ["place","lc-place"]
    ],
    "partner-match": [
      ["month","pm-p1-month"], ["day","pm-p1-day"], ["year","pm-p1-year"],
      ["hour","pm-p1-hour"], ["minute","pm-p1-minute"], ["ampm","pm-p1-ampm"]
    ],
    "timeline": [
      ["month","ptw-month"], ["day","ptw-day"], ["year","ptw-year"],
      ["hour","ptw-hour"], ["minute","ptw-minute"], ["ampm","ptw-ampm"],
      ["place","ptw-place"]
    ]
  };
  // Same field mappings, reused for the quick-glance iframes.
  var QUICK_MAP = {
    "location": WIDGET_MAP["location-checker"],
    "partner": WIDGET_MAP["partner-match"],
    "timeline": WIDGET_MAP["timeline"]
  };

  function fireEvents(el){
    if (!el) return;
    try {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    } catch(e){}
  }

  function getDoc(iframeEl){
    try { return iframeEl.contentDocument || iframeEl.contentWindow.document; }
    catch(e){ return null; }
  }

  function applyFieldMap(doc, p, map){
    if (!doc || !map) return;
    map.forEach(function(pair){
      var field = pair[0], id = pair[1];
      var el = doc.getElementById(id);
      if (!el) return;
      if (field === "unknown"){
        el.checked = !!p.timeUnknown;
        fireEvents(el);
        return;
      }
      if (field === "place"){
        el.value = p.place || "";
        fireEvents(el);
        return;
      }
      var val = p[field];
      if (val === undefined || val === null) return;
      el.value = val;
      fireEvents(el);
    });
  }

  function applyProfileToIframe(panelName, iframeEl){
    var p = readProfile();
    if (!p) return;
    var doc = getDoc(iframeEl);
    applyFieldMap(doc, p, WIDGET_MAP[panelName]);
  }

  function makeIframeBackgroundTransparent(iframeEl){
    var doc = getDoc(iframeEl);
    if (!doc || !doc.head) return;
    try {
      var style = doc.createElement("style");
      style.setAttribute("data-injected", "pw-transparent-bg");
      style.textContent = "html, body { background: transparent !important; }";
      doc.head.appendChild(style);
    } catch(e){}
  }

  function applyProfileToAllIframes(){
    panels.forEach(function(panel){
      var name = panel.getAttribute("data-panel");
      var iframe = panel.querySelector("iframe");
      if (iframe) applyProfileToIframe(name, iframe);
    });
    quickPanels.forEach(function(panel){
      var name = panel.getAttribute("data-quick-panel");
      var iframe = panel.querySelector("iframe");
      if (iframe) applyProfileToQuickIframe(name, iframe);
    });
  }

  panels.forEach(function(panel){
    var name = panel.getAttribute("data-panel");
    var iframe = panel.querySelector("iframe");
    if (!iframe) return;
    iframe.addEventListener("load", function(){
      applyProfileToIframe(name, iframe);
      makeIframeBackgroundTransparent(iframe);
    });
  });

  // =========================================================
  // Quick-glance iframes: fill birth data, hide everything but
  // the result-bar section, auto-trigger a reading, keep sized
  // to just that content.
  // =========================================================

  // hide-selectors per quick view, chosen so only the result
  // section (already styled as a self-contained card) stays visible
  var QUICK_HIDE = {
    "forecast": ["header",".collapsible-panel",".zodiac-card",".breakdown-card","footer"],
    "location": ["header",".zodiac-card","footer","#lc-error"],
    "partner": ["header",".collapsible-panel",".pm-two-col",".breakdown-card","footer","#pm-error"],
    "timeline": ["header",".ppt-hint",".zodiac-card","footer"]
  };

  function injectCompactCss(doc, hideSelectors){
    if (!doc || !doc.head) return;
    try {
      var style = doc.createElement("style");
      style.setAttribute("data-injected", "pw-compact");
      style.textContent =
        hideSelectors.join(",") + "{ display:none !important; }" +
        ".app{ padding:12px !important; max-width:100% !important; }" +
        ".meter-card{ margin-bottom:0 !important; }";
      doc.head.appendChild(style);
    } catch(e){}
  }

  function autoSizeIframe(iframeEl, doc){
    function sync(){
      try {
        var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        iframeEl.style.height = (h + 4) + "px";
      } catch(e){}
    }
    sync();
    try {
      var ro = new ResizeObserver(function(){ sync(); });
      ro.observe(doc.body);
    } catch(e){
      // fallback if ResizeObserver isn't available
      setInterval(sync, 800);
    }
  }

  function zodiacSignFromDate(month, day){
    var ranges = [
      ["Capricorn", 1, 19], ["Aquarius", 1, 20, 2, 18], ["Pisces", 2, 19, 3, 20],
      ["Aries", 3, 21, 4, 19], ["Taurus", 4, 20, 5, 20], ["Gemini", 5, 21, 6, 20],
      ["Cancer", 6, 21, 7, 22], ["Leo", 7, 23, 8, 22], ["Virgo", 8, 23, 9, 22],
      ["Libra", 9, 23, 10, 22], ["Scorpio", 10, 23, 11, 21], ["Sagittarius", 11, 22, 12, 21],
      ["Capricorn", 12, 22, 12, 31]
    ];
    for (var i = 0; i < ranges.length; i++){
      var r = ranges[i];
      if (r.length === 3){
        if (month === r[1] && day <= r[2]) return r[0];
      } else {
        var startM = r[1], startD = r[2], endM = r[3], endD = r[4];
        if ((month === startM && day >= startD) || (month === endM && day <= endD)) return r[0];
      }
    }
    return "Aries";
  }

  function triggerForecast(doc, p){
    if (!doc) return;
    var sign = zodiacSignFromDate(p.month, p.day);
    var wrap = doc.getElementById("zodiacRow");
    if (!wrap) return;
    var btn = Array.prototype.slice.call(wrap.children).filter(function(b){
      return b.title === sign;
    })[0];
    if (btn && !btn.classList.contains("active")) btn.click();
  }

  function triggerTimeline(doc){
    if (!doc) return;
    var form = doc.getElementById("ptw-form");
    if (!form) return;
    try {
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    } catch(e){}
  }

  function applyProfileToQuickIframe(name, iframeEl){
    var p = readProfile();
    if (!p) return;
    var doc = getDoc(iframeEl);
    if (!doc) return;
    if (QUICK_MAP[name]) applyFieldMap(doc, p, QUICK_MAP[name]);
    if (name === "forecast") triggerForecast(doc, p);
    if (name === "timeline") setTimeout(function(){ triggerTimeline(doc); }, 50);
  }

  quickPanels.forEach(function(panel){
    var name = panel.getAttribute("data-quick-panel");
    var iframe = panel.querySelector("iframe");
    if (!iframe) return;
    iframe.addEventListener("load", function(){
      var doc = getDoc(iframe);
      makeIframeBackgroundTransparent(iframe);
      injectCompactCss(doc, QUICK_HIDE[name] || []);
      applyProfileToQuickIframe(name, iframe);
      autoSizeIframe(iframe, doc);
    });
  });

})();
</script>

</body>
</html>
